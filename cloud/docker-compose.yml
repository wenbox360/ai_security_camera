services:
  api:
    build:
      context: .
    command: uvicorn cloud.main:app --host 0.0.0.0 --port 8000 --reload
    environment: &app-environment
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://security_camera:security_camera@db:3306/security_camera_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-security-camera-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-development-secret}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
    ports:
      - "8000:8000"
    volumes:
      - .:/app/cloud
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true

  worker:
    build:
      context: .
    command: celery -A cloud.celery_app worker --loglevel=info
    environment: *app-environment
    volumes:
      - .:/app/cloud
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: security_camera_db
      MYSQL_USER: security_camera
      MYSQL_PASSWORD: security_camera
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
